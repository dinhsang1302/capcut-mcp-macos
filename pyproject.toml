[project]
name = "capcut-mcp-macos"
version = "0.2.0"
description = "Independent macOS edition of the local CapCut MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Henri8"}]
maintainers = [{name = "dinhsang1302"}]
classifiers = ["Operating System :: MacOS :: MacOS X", "Programming Language :: Python :: 3"]
dependencies = ["mcp==2.3.0"]

[project.urls]
Repository = "https://github.com/dinhsang1302/capcut-mcp-macos"

[project.scripts]
capcut-mcp = "capcut_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capcut_mcp"]
